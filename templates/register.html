{% extends "base.html" %}
{% block title %}회원가입 – MediaHub{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <h1 class="auth-title">회원가입</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="auth-error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="username">아이디 <span class="required">*</span></label>
        <input type="text" id="username" name="username" required autofocus
               placeholder="3자 이상" minlength="3" maxlength="50">
      </div>
      <div class="form-group">
        <label for="password">비밀번호 <span class="required">*</span></label>
        <input type="password" id="password" name="password" required
               placeholder="6자 이상" minlength="6">
      </div>
      <div class="form-group">
        <label for="email">이메일 <small style="color:var(--text-dim)">(선택)</small></label>
        <input type="email" id="email" name="email"
               placeholder="example@email.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block">가입하기</button>
    </form>

    <p class="auth-link">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
  </div>
</div>
{% endblock %}
